
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus CRM</title>
    <title>Nexus CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
      .kanban-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
      .kanban-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
      .kanban-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fadeIn 0.3s ease-out; }
      @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .animate-scale-in { animation: scaleIn 0.2s ease-out; }

      /* Chevron Progress Bar Styling */
      .chevron-step {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        height: 36px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #E5E7EB;
        color: #6B7280;
        margin-right: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .chevron-step:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
      .chevron-step:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; margin-right: 0; }
      
      .chevron-step::after {
        content: "";
        position: absolute;
        right: -12px;
        top: 0;
        width: 0;
        height: 0;
        border-top: 18px solid transparent;
        border-bottom: 18px solid transparent;
        border-left: 12px solid #E5E7EB;
        z-index: 10;
        transition: border-left-color 0.2s;
      }
      .chevron-step:last-child::after { display: none; }
      
      .chevron-step.active { background: #00D2FF; color: #00455B; }
      .chevron-step.active::after { border-left-color: #00D2FF; }
      
      .chevron-step.completed { background: #D1FAE5; color: #065F46; }
      .chevron-step.completed::after { border-left-color: #D1FAE5; }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
